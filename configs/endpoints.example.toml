# Endpoints for llmjudge. Copy to configs/endpoints.toml and edit; the copy is yours,
# this example is the one under version control.
#
# You do not need this file for a single server: `--base-url https://host/v1 --model NAME`
# is a whole endpoint, with the key in --api-key or LLMJUDGE_API_KEY. This file is for a
# run against several at once.
#
# URLs and keys stay in .env; this file only names the keys, so it is safe to commit and
# safe to paste into a ticket. A key that is not in the env file -- or no env file at all --
# is looked up in the process environment instead. Paths are relative to the repository root.
#
# concurrency       starting in-flight window; the script grows it while throughput rises
# max_concurrency   ceiling; keep it at or below vLLM's --max-num-seqs. Requests above it
#                   only queue inside vLLM, and behind Cloudflare the queue wait counts
#                   toward the ~100 s after which the tunnel answers 524.
# min_concurrency   floor after 429s / timeouts halve the window (default 1)
# account, quota    requests are counted per account per UTC calendar month in quota_file,
#                   preflight and probes included. 0 = not limited (Cloudflare, SSH).
# metrics           poll vLLM /metrics every 10 s and stop growing while requests queue.
#                   Only where requests are not capped.
# extra             merged into every request body, e.g. for a thinking-capable model:
#                   extra = { chat_template_kwargs = { enable_thinking = false } }
# drop              request fields this API rejects, removed from the body. Anthropic has
#                   no seed, the reasoning models reject temperature, and newer OpenAI
#                   models want max_completion_tokens -- renaming is drop plus extra:
#                   drop = ["max_tokens"], extra = { max_completion_tokens = 4096 }
# enabled = false   keep an entry without using it
#
# For an API that is not shaped like vLLM. The base URL is used as it is written: a URL
# that already carries a path keeps it (Azure's /openai/deployments/<name>, a gateway
# prefix), and only a bare host gets /v1 appended.
# chat_path         the path the request goes to, default "/chat/completions".
# models_path       the model listing preflight checks, default "/models". "" skips the
#                   check, for an API that has none or that lists deployment names; the
#                   canary still has to come back sound.
# auth_header       the header the key goes in, default "Authorization". "api-key" for
#                   Azure, "x-api-key" elsewhere -- and a header that is not
#                   Authorization takes the key raw, with no "Bearer".
# auth_scheme       "bearer" (the default for Authorization), "basic", or "raw".
# headers           more headers for this endpoint, e.g.
#                   headers = { x-portkey-provider = "azure" }. An empty value removes a
#                   header the judge would otherwise send.
#
# Every endpoint here must speak the OpenAI chat-completions body: a messages array with
# the system prompt as its first message, and response_format for guided decoding. An API
# with a body of its own -- Anthropic's native /v1/messages, where the system prompt is a
# top-level field -- needs an adapter, not these keys. That is step 4 of the plan.
#
# Every endpoint a run may use must be listed here when the run starts. Its URL may come
# later: an endpoint whose url_key is not in its env file yet waits, and joins as soon as
# the key appears (checked every few seconds).

quota_file = "runs/quota.json"

# ---- Colab notebooks: notebooks/serve_vllm.py, vLLM 0.29.0, --max-num-seqs 16,
#      Cloudflare tunnel

[[endpoint]]
name = "colab-a"
env_file = ".env"
url_key = "MEDGEMMA_BASE_URL"
auth_key = "MEDGEMMA_API_KEY"
model = "medgemma-27b-it"
concurrency = 8
max_concurrency = 16
account = "cloudflare"
quota = 0
metrics = true

[[endpoint]]
name = "colab-b"
env_file = ".env"
url_key = "MEDGEMMA_BASE_URL_2"      # add to .env when notebook 2 is up
auth_key = "MEDGEMMA_API_KEY"        # both notebooks use the same key
model = "medgemma-27b-it"
concurrency = 8
max_concurrency = 16
account = "cloudflare"
quota = 0
metrics = true

# ---- A vendor API, for the frontier-model comparison in --mode compare. Disabled here
#      because it costs money. Azure is the awkward shape: a deployment path, an
#      api-version query, and the key in api-key rather than Authorization.

[[endpoint]]
name = "azure"
enabled = false
# https://<resource>.openai.azure.com/openai/deployments/<dep>?api-version=2024-06-01
url_key = "AZURE_BASE_URL"           # the path and the query are kept as written
auth_key = "AZURE_API_KEY"
auth_header = "api-key"              # so the key is sent raw, without "Bearer"
models_path = ""                     # Azure lists deployments, not model names
model = "gpt-4o-mini"                # the deployment's model
drop = ["seed"]
concurrency = 4
max_concurrency = 8
account = "azure"
quota = 2000                         # a ceiling, so nobody judges 55,000 rows by accident

# ---- ngrok on the DGX Spark: disabled since the move to Cloudflare

[[endpoint]]
name = "spark-a"
enabled = false
env_file = ".env"
url_key = "NGROK_URL"
auth_key = "NGROK_API_KEY"           # bearer token, from .env
model = "medgemma-27b-it"
concurrency = 8
max_concurrency = 128
account = "ngrok-1"
quota = 19000

[[endpoint]]
name = "spark-b"
enabled = false
env_file = ".env"
url_key = "NGROK_URL_2"
auth_key = "NGROK_API_KEY_2"
model = "medgemma-27b-it"
concurrency = 8
max_concurrency = 128
account = "ngrok-2"                  # assumed separate from ngrok-1
quota = 19000
